name: flutter_nv2
description: "Yu-Gi-Oh! App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_fonts: ^8.0.2
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  easy_localization: ^3.0.8
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_riverpod: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icone.png"
  adaptive_icon_foreground: "assets/icons/icone.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/personagens/
    - assets/curiosidades/
    - assets/perfis/
    - assets/translations/